version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nahidka-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - valkey

  valkey:
    image: valkey/valkey:latest
    container_name: nahidka-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  backend:
    build:
      context: ../../back-end
      dockerfile: Dockerfile
    image: nahidka-backend:local
    container_name: nahidka-backend
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    environment:
      - DB_PATH=/app/data/nahidka.db
      - VALKEY_URL=valkey:6379
    depends_on:
      - valkey

volumes:
  backend_data:
  valkey_data:
