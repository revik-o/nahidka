version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nahidka-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ../../back-end
      dockerfile: Dockerfile
    image: nahidka-backend:local
    container_name: nahidka-backend
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    environment:
      - DB_PATH=/app/data/nahidka.db
      - VALKEY_URL=valkey:6379

volumes:
  backend_data:
